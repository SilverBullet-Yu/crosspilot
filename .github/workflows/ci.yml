name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.115" "uvicorn[standard]>=0.32" "pydantic>=2.9" \
            "httpx>=0.27" "sqlalchemy>=2.0" "psycopg[binary]>=3.2" \
            "pytest>=8.3" "ruff>=0.7" "mypy>=1.13"
      - name: Lint
        run: ruff check apps/api
      - name: Type check
        run: mypy apps/api/src
        env:
          MYPYPATH: apps/api/src
      - name: Hard-constraint regression
        run: pytest apps/api -q
        env:
          PYTHONPATH: apps/api/src
